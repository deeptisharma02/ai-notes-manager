; OPcache — caches compiled PHP so vendor files are not re-parsed on every
; request. This is the single biggest dev-speed win on Docker bind mounts.
opcache.enable=1
; php artisan serve uses the CLI SAPI, so OPcache must be enabled for CLI too.
opcache.enable_cli=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; On Docker-on-Windows bind mounts, stat()-ing every cached file per request
; (validate_timestamps=1) is extremely slow. Disable revalidation so OPcache
; serves purely from memory. Note: after editing PHP code, restart the app
; container (docker compose restart app) to pick up changes.
opcache.validate_timestamps=0
opcache.fast_shutdown=1

; realpath cache greatly reduces filesystem stat() calls over slow bind mounts.
realpath_cache_size=4096K
realpath_cache_ttl=600
